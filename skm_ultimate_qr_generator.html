<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKM Luxury QR Card Studio — Theme-Synced</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="all_luxury_themes.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; }
        body { background: #0c0e14; color: #f8f6f0; min-height: 100vh; padding: 20px; }
        .studio-wrap { max-width: 1220px; margin: 0 auto; display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
        @media (max-width: 900px) { .studio-wrap { grid-template-columns: 1fr; } }
        .panel {
            background: #141720; border: 1px solid rgba(217,177,80,0.28); border-radius: 20px;
            padding: 20px; box-shadow: 0 18px 45px rgba(0,0,0,0.45);
        }
        .panel h2 { font-family: 'Playfair Display', 'Kantumruy Pro', serif; font-size: 18px; color: #F3D98B; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .fg { margin-bottom: 13px; }
        .fg label { display: block; font-size: 12px; font-weight: 800; color: #b8b2a6; margin-bottom: 5px; }
        .inp {
            width: 100%; padding: 10px 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
            background: #1b1f2b; color: #f8f6f0; font-size: 13px; font-weight: 700; outline: none;
        }
        .inp:focus { border-color: #D9B150; }
        .btn-gold {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: none; cursor: pointer;
            background: linear-gradient(135deg, #C29634, #F2D684, #C99C3B); color: #14110B;
            font-weight: 900; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 8px 22px rgba(217,177,80,0.32); transition: transform 0.2s;
        }
        .btn-gold:active { transform: scale(0.97); }
        .btn-ghost {
            width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(217,177,80,0.35);
            background: rgba(217,177,80,0.08); color: #F3D98B; font-weight: 800; font-size: 12.5px;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        }
        .cards-stage {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px;
        }
        .qr-lux-card {
            border-radius: 24px; padding: 22px 18px; text-align: center; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45); break-inside: avoid; page-break-inside: avoid;
        }
        .qr-lux-card .card-logo {
            width: 66px; height: 66px; border-radius: 50%; object-fit: cover; padding: 3px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .qr-lux-card .card-eyebrow { font-size: 9px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; }
        .qr-lux-card .card-shop { font-size: 19px; font-weight: 900; line-height: 1.25; }
        .qr-lux-card .card-qr-frame {
            background: #ffffff; padding: 12px; border-radius: 18px;
            box-shadow: 0 10px 26px rgba(0,0,0,0.22);
        }
        .qr-lux-card .card-qr-frame img { display: block; width: 175px; height: 175px; object-fit: contain; }
        .qr-lux-card .card-table-pill {
            padding: 6px 18px; border-radius: 999px; font-size: 13px; font-weight: 900; letter-spacing: 0.5px;
        }
        .qr-lux-card .card-tagline { font-size: 11px; font-weight: 700; opacity: 0.85; }
        .qr-lux-card .card-dl-mini {
            margin-top: 4px; padding: 6px 12px; border-radius: 999px; border: 1px dashed currentColor;
            background: transparent; color: inherit; font-size: 10.5px; font-weight: 800; cursor: pointer; opacity: 0.8;
        }
        .qr-lux-card .card-dl-mini:hover { opacity: 1; }
        #toast {
            position: fixed; top: 18px; left: 50%; transform: translate(-50%, -100px);
            background: #159966; color: #fff; padding: 10px 22px; border-radius: 999px;
            font-size: 13px; font-weight: 800; z-index: 9999; transition: transform 0.35s ease;
        }
        #toast.show { transform: translate(-50%, 0); }
        @media print {
            body { background: #fff !important; padding: 0 !important; }
            .no-print, .card-dl-mini { display: none !important; }
            .studio-wrap { display: block !important; max-width: 100% !important; }
            .cards-stage { grid-template-columns: repeat(2, 1fr) !important; gap: 14px !important; padding: 10px !important; }
            .qr-lux-card { box-shadow: none !important; border-width: 2px !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>
<div class="studio-wrap">
    <!-- Controls Sidebar -->
    <div class="panel no-print">
        <h2><i class="fa-solid fa-crown"></i> ស្ទូឌីយោកាត QR តាមតុ</h2>
        <p style="font-size: 12px; color: #9a9589; margin-bottom: 14px; line-height: 1.5;">
            ទាញពណ៌ស្បែក Luxury, ឈ្មោះហាង, Logo និងបញ្ជីតុ/VIP ដោយស្វ័យប្រវត្តិពីប្រព័ន្ធ Admin Settings ដើម្បីឱ្យកាត QR លើតុស៊ីគ្នា ១០០% ជាមួយ Digital Menu!
        </p>

        <div class="fg">
            <label>👑 ស្បែកកាត QR (Synced ពី Menu Theme):</label>
            <select id="qrThemeSelect" class="inp" onchange="renderQRCards()"></select>
        </div>

        <div class="fg">
            <label>🏪 ឈ្មោះហាង (Shop Name):</label>
            <input type="text" id="qrShopName" class="inp" value="SKM INTEGRATE" oninput="renderQRCards()">
        </div>

        <div class="fg">
            <label>✨ សារអញ្ជើញស្កេន (Scan Tagline):</label>
            <input type="text" id="qrTagline" class="inp" value="ស្កេនមើលបញ្ជីមុខម្ហូប & កុម្ម៉ង់ភ្លាមៗ • Scan for Digital Menu" oninput="renderQRCards()">
        </div>

        <div class="fg">
            <label>🪑 ជ្រើសរើសបង្ហាញកាត (Tables Mode):</label>
            <select id="qrModeSelect" class="inp" onchange="renderQRCards()">
                <option value="single">📄 កាតតែ ១ (Main Menu / ជ្រើសតុ ១)</option>
                <option value="vip">👑 កាតតុ VIP ទាំងអស់</option>
                <option value="batch">🖨️ ព្រីនជាឈុត (តុទាំងអស់ + VIP)</option>
            </select>
        </div>

        <div class="fg" id="singleTableWrap">
            <label>🏷️ ឈ្មោះតុលើកាត (ទទេ = កាត Menu រួម):</label>
            <input type="text" id="qrSingleTable" class="inp" placeholder="ឧ. តុលេខ 1 ឬ VIP 1" oninput="renderQRCards()">
        </div>

        <div class="fg" id="batchLimitWrap" style="display:none;">
            <label>🔢 ចំនួនតុធម្មតាដែលត្រូវបង្កើត (1 ដល់ ...):</label>
            <input type="number" id="qrBatchCount" class="inp" value="8" min="1" max="50" oninput="renderQRCards()">
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px; margin-top: 16px;">
            <button type="button" class="btn-gold" onclick="window.print()">
                <i class="fa-solid fa-print"></i> ព្រីនកាត QR ទាំងអស់ (Print A4 / PDF)
            </button>
            <button type="button" class="btn-ghost" onclick="downloadFirstCardPng()">
                <i class="fa-solid fa-download"></i> ទាញយកកាតដំបូងជារូប PNG ច្បាស់
            </button>
            <button type="button" class="btn-ghost" style="border-color: rgba(255,255,255,0.2); color: #ccc; background: transparent;" onclick="window.location.href='admin_settings.html?branch=' + encodeURIComponent(BRANCH)">
                <i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅ Admin Settings
            </button>
        </div>
    </div>

    <!-- Preview & Print Stage -->
    <div>
        <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
            <div style="font-size:14px; font-weight:900; color:#F3D98B;">
                <i class="fa-solid fa-sparkles"></i> គំរូកាត QR ផ្ទាល់ (<span id="qrCardCountLabel">1</span> កាត)
            </div>
            <div style="font-size:11.5px; color:#9a9589;" id="qrSyncedStatus">🔄 កំពុងទាញព័ត៌មានសាខា...</div>
        </div>
        <div id="qrCardsStage" class="cards-stage"></div>
    </div>
</div>

<div id="toast">Done!</div>

<script>
    const BRANCH = new URLSearchParams(window.location.search).get('branch') || 'branch_1';
    const SUPABASE_URL = 'https://qlzyyfqjwudbapgwsugu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsenl5ZnFqd3VkYmFwZ3dzdWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODk2MzUsImV4cCI6MjEwODY2NTYzNX0.XQxNiUn2ZhivOjbqcWj0T6W1Abtx1H3kWrzIwqJPVtQ';
    let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let shopLogoUrl = '';
    let tablePrefix = 'តុលេខ';
    let customVipList = ['VIP 1', 'VIP 2', 'VIP 3'];
    let customBrandThemeObj = null;

    const LEGACY_MAP = {
        obsidian: '08_obsidian_michelin', ivory: '15_pearl_patisserie',
        emerald: '13_parisian_bistro', sapphire: '40_sapphire_cyber',
        rose_champagne: '16_rose_macaron', royal_espresso: '01_royal_espresso'
    };

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2400);
    }

    function getMenuBaseUrl() {
        const path = window.location.pathname;
        const base = window.location.origin + path.substring(0, path.lastIndexOf('/') + 1);
        return base + 'menu.html?branch=' + encodeURIComponent(BRANCH);
    }

    function populateThemeDropdown(activeId) {
        const sel = document.getElementById('qrThemeSelect');
        const catalog = Array.isArray(window.SKM_52_LUXURY_THEMES) ? window.SKM_52_LUXURY_THEMES : [];
        let html = '';
        if (customBrandThemeObj) {
            html += `<option value="custom_brand">✨ Custom Brand Theme (ទាញពី Logo ហាង)</option>`;
        }
        html += catalog.map(t => `<option value="${t.id}">#${String(t.num).padStart(2,'0')} ${t.nameKm} — ${t.nameEn} (${t.tag})</option>`).join('');
        sel.innerHTML = html;
        const resolved = LEGACY_MAP[activeId] || activeId || '08_obsidian_michelin';
        if ([...sel.options].some(o => o.value === resolved)) sel.value = resolved;
    }

    function getActiveThemeObj() {
        const val = document.getElementById('qrThemeSelect').value;
        if (val === 'custom_brand' && customBrandThemeObj) return customBrandThemeObj;
        const catalog = Array.isArray(window.SKM_52_LUXURY_THEMES) ? window.SKM_52_LUXURY_THEMES : [];
        return catalog.find(t => t.id === val) || catalog[7] || {
            nameEn: 'Obsidian Gold', bgMain: '#0A0B0F', bgCard: '#14161D', surfaceGrad: '#0E0E13',
            accent: '#D9B150', accent2: '#F3D98B', grad: 'linear-gradient(135deg,#C29634,#F2D684)',
            textMain: '#F8F6F0', btnText: '#14110B', border: 'rgba(217,177,80,0.4)',
            fontHeading: "'Playfair Display','Kantumruy Pro',serif"
        };
    }

    function getCardItemsList() {
        const mode = document.getElementById('qrModeSelect').value;
        document.getElementById('singleTableWrap').style.display = mode === 'single' ? 'block' : 'none';
        document.getElementById('batchLimitWrap').style.display = mode === 'batch' ? 'block' : 'none';

        if (mode === 'single') {
            const tb = document.getElementById('qrSingleTable').value.trim();
            return [{ tableLabel: tb || 'DIGITAL MENU', tableParam: tb }];
        }
        if (mode === 'vip') {
            return (customVipList.length ? customVipList : ['VIP 1', 'VIP 2', 'VIP 3']).map(v => ({ tableLabel: v, tableParam: v }));
        }
        const count = Math.min(50, Math.max(1, parseInt(document.getElementById('qrBatchCount').value) || 8));
        const arr = [];
        customVipList.forEach(v => arr.push({ tableLabel: v, tableParam: v }));
        for (let i = 1; i <= count; i++) {
            const lbl = `${tablePrefix} ${i}`;
            arr.push({ tableLabel: lbl, tableParam: lbl });
        }
        return arr;
    }

    function renderQRCards() {
        const t = getActiveThemeObj();
        const shopName = document.getElementById('qrShopName').value.trim() || 'SKM INTEGRATE';
        const tagline = document.getElementById('qrTagline').value.trim();
        const items = getCardItemsList();
        const baseUrl = getMenuBaseUrl();

        document.getElementById('qrCardCountLabel').textContent = items.length;
        const stage = document.getElementById('qrCardsStage');

        stage.innerHTML = items.map((item, idx) => {
            const fullUrl = item.tableParam ? `${baseUrl}&table=${encodeURIComponent(item.tableParam)}` : baseUrl;
            const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=6&data=${encodeURIComponent(fullUrl)}`;
            const logoHtml = shopLogoUrl
                ? `<img src="${shopLogoUrl}" class="card-logo" style="background:${t.grad};" crossorigin="anonymous" onerror="this.style.display='none'">`
                : `<div class="card-logo" style="background:${t.grad}; color:${t.btnText}; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900;">👑</div>`;

            return `
            <div class="qr-lux-card" style="background:${t.isDark ? t.surfaceGrad : t.bgCard}; color:${t.textMain}; border:2px solid ${t.accent};">
                ${logoHtml}
                <div class="card-eyebrow" style="color:${t.accent};">✦ SIGNATURE DIGITAL MENU ✦</div>
                <div class="card-shop" style="font-family:${t.fontHeading}; color:${t.textMain};">${shopName}</div>
                <div class="card-qr-frame" style="border:2px solid ${t.border};">
                    <img src="${qrImgUrl}" alt="QR ${item.tableLabel}" crossorigin="anonymous">
                </div>
                <div class="card-table-pill" style="background:${t.grad}; color:${t.btnText};">
                    ${item.tableLabel}
                </div>
                <div class="card-tagline" style="color:${t.textMuted || t.textMain};">${tagline}</div>
                <button type="button" class="card-dl-mini" onclick="downloadCardPng('${item.tableLabel.replace(/'/g, "\\'")}', '${item.tableParam.replace(/'/g, "\\'")}')">
                    <i class="fa-solid fa-download"></i> ទាញយក PNG
                </button>
            </div>`;
        }).join('');
    }

    async function downloadCardPng(tableLabel, tableParam) {
        const t = getActiveThemeObj();
        const shopName = document.getElementById('qrShopName').value.trim() || 'SKM INTEGRATE';
        const tagline = document.getElementById('qrTagline').value.trim();
        const baseUrl = getMenuBaseUrl();
        const fullUrl = tableParam ? `${baseUrl}&table=${encodeURIComponent(tableParam)}` : baseUrl;
        const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data=${encodeURIComponent(fullUrl)}`;

        const canvas = document.createElement('canvas');
        canvas.width = 900; canvas.height = 1280;
        const ctx = canvas.getContext('2d');

        // Background
        const bgGrad = ctx.createLinearGradient(0, 0, 900, 1280);
        bgGrad.addColorStop(0, t.bgMain);
        bgGrad.addColorStop(1, t.bgCard);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 900, 1280);

        // Luxury Gold/Accent Double Border
        ctx.strokeStyle = t.accent;
        ctx.lineWidth = 10;
        ctx.strokeRect(28, 28, 844, 1224);
        ctx.lineWidth = 2;
        ctx.strokeRect(46, 46, 808, 1188);

        function drawRoundRect(c, x, y, w, h, r) {
            c.beginPath();
            if (typeof c.roundRect === 'function') { c.roundRect(x, y, w, h, r); }
            else {
                c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
                c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
                c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
            }
        }

        const loadImage = (src) => new Promise((res, rej) => {
            const im = new Image(); im.crossOrigin = 'anonymous';
            im.onload = () => res(im); im.onerror = rej; im.src = src;
        });

        // Optional Circular Shop Logo at Top
        let topOffset = 0;
        if (shopLogoUrl) {
            try {
                const lg = await loadImage(shopLogoUrl);
                ctx.save();
                ctx.beginPath();
                ctx.arc(450, 128, 56, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = t.accent;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(450, 128, 51, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(lg, 399, 77, 102, 102);
                ctx.restore();
                topOffset = 82;
            } catch(logoErr) { topOffset = 0; }
        }

        // Eyebrow
        ctx.fillStyle = t.accent;
        ctx.font = 'bold 24px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✦  SIGNATURE DIGITAL MENU  ✦', 450, 140 + topOffset);

        // Shop Name
        ctx.fillStyle = t.textMain;
        ctx.font = 'bold 52px "Playfair Display", "Kantumruy Pro", serif';
        ctx.fillText(shopName, 450, 218 + topOffset);

        // White QR Card Box
        const qrBoxY = 268 + Math.round(topOffset * 0.65);
        ctx.fillStyle = '#FFFFFF';
        drawRoundRect(ctx, 185, qrBoxY, 530, 530, 36);
        ctx.fill();

        try {
            const qrImg = await loadImage(qrImgUrl);
            ctx.drawImage(qrImg, 215, qrBoxY + 30, 470, 470);
        } catch(e) {
            showToast('⚠️ មិនអាចទាញរូប QR បានទេ សូមពិនិត្យអ៊ីនធឺណិត!');
            return;
        }

        // Table Badge Pill
        ctx.fillStyle = t.accent;
        drawRoundRect(ctx, 210, 880, 480, 88, 44);
        ctx.fill();
        ctx.fillStyle = t.btnText;
        ctx.font = 'bold 40px "Kantumruy Pro", sans-serif';
        ctx.fillText(tableLabel, 450, 938);

        // Tagline
        ctx.fillStyle = t.textMuted || t.textMain;
        ctx.font = '600 24px "Kantumruy Pro", sans-serif';
        ctx.fillText(tagline, 450, 1060);

        ctx.fillStyle = t.accent;
        ctx.font = 'bold 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('POWERED BY SKM INTEGRATE', 450, 1175);

        const a = document.createElement('a');
        a.download = `QR_${shopName.replace(/\s+/g,'_')}_${tableLabel.replace(/\s+/g,'_')}.png`;
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a); a.click(); a.remove();
        showToast(`✅ ទាញយកកាត PNG "${tableLabel}" ជោគជ័យ!`);
    }

    function downloadFirstCardPng() {
        const items = getCardItemsList();
        if (items.length) downloadCardPng(items[0].tableLabel, items[0].tableParam);
    }

    async function initStudio() {
        let sys = {};
        let shopName = localStorage.getItem(`ks2_${BRANCH}_shop_name`) || 'SKM INTEGRATE';
        shopLogoUrl = localStorage.getItem(`ks2_${BRANCH}_shop_logo`) || '';
        try { sys = JSON.parse(localStorage.getItem(`ks2_${BRANCH}_sys_settings`)) || {}; } catch(e) {}

        if (supabaseClient && navigator.onLine) {
            try {
                const { data } = await supabaseClient
                    .from('branch_store')
                    .select('shop_info, sys_settings, data_json')
                    .eq('branch_id', BRANCH)
                    .maybeSingle();
                if (data) {
                    const d = data.data_json || {};
                    const info = Object.assign({}, { shopName: d.shopName, shopLogo: d.shopLogo }, data.shop_info || {});
                    sys = Object.assign({}, d.sysSettings || {}, data.sys_settings || {});
                    if (info.shopName) shopName = info.shopName;
                    if (info.shopLogo) shopLogoUrl = info.shopLogo;
                }
            } catch(e) {}
        }

        document.getElementById('qrShopName').value = shopName;
        tablePrefix = sys.tablePrefix || 'តុលេខ';
        if (sys.totalTables) document.getElementById('qrBatchCount').value = Math.min(20, parseInt(sys.totalTables) || 8);
        const rawVip = sys.customTables || sys.customTablesList || 'VIP 1, VIP 2, VIP 3';
        customVipList = String(rawVip).split(',').map(s => s.trim()).filter(Boolean);
        if (sys.customBrandTheme && typeof sys.customBrandTheme === 'object') {
            customBrandThemeObj = sys.customBrandTheme;
        }

        const activeThemeId = sys.menuLuxuryTheme || sys.posLuxuryTheme || '08_obsidian_michelin';
        populateThemeDropdown(activeThemeId);
        document.getElementById('qrSyncedStatus').innerHTML = `✅ បាន Sync ស្បែកពីសាខា <b>${BRANCH}</b> ដោយស្វ័យប្រវត្តិ`;
        renderQRCards();
    }

    window.onload = initStudio;
</script>
