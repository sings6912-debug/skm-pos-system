<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display (KDS) & Queue - SKM POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', 'Nunito', sans-serif; }
        body { background: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        #lockedScreen {
            position: fixed; inset: 0; background: #0b1120; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px;
        }
        .topbar {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            padding: 14px 22px; background: #111827; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 50;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 900; color: #38bdf8; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn {
            padding: 8px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b;
            color: #e2e8f0; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
        .btn-green { background: #059669; border-color: #10b981; color: #fff; }
        .btn-amber { background: #d97706; border-color: #f59e0b; color: #fff; }
        .btn-slate { background: #334155; border-color: #475569; color: #fff; }

        /* Kitchen Board 3 Columns */
        .board {
            flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 18px;
        }
        @media (max-width: 960px) { .board { grid-template-columns: 1fr; } }
        .col {
            background: rgba(17, 24, 39, 0.85); border: 1px solid #1f2937; border-radius: 18px;
            display: flex; flex-direction: column; overflow: hidden; min-height: 60vh;
        }
        .col-head {
            padding: 14px 18px; font-size: 16px; font-weight: 900; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .col-new .col-head { background: rgba(239, 68, 68, 0.14); color: #f87171; }
        .col-prep .col-head { background: rgba(245, 158, 11, 0.14); color: #fbbf24; }
        .col-ready .col-head { background: rgba(16, 185, 129, 0.14); color: #34d399; }
        .col-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }

        .ticket {
            background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 10px;
        }
        .ticket-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .ticket-id { font-family: monospace; font-size: 15px; font-weight: 900; color: #38bdf8; }
        .ticket-cust { font-size: 16px; font-weight: 900; color: #fff; margin-top: 2px; }
        .timer-pill { padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 900; white-space: nowrap; }
        .t-ok { background: rgba(16,185,129,0.2); color: #34d399; }
        .t-warn { background: rgba(245,158,11,0.22); color: #fbbf24; }
        .t-late { background: rgba(239,68,68,0.25); color: #f87171; }
        .ticket-items { list-style: none; border-top: 1px dashed #334155; border-bottom: 1px dashed #334155; padding: 8px 0; display: flex; flex-direction: column; gap: 6px; }
        .ticket-items li { font-size: 14.5px; font-weight: 700; color: #f1f5f9; display: flex; gap: 8px; }
        .qty-box { background: #0f172a; color: #fde047; padding: 1px 8px; border-radius: 6px; font-weight: 900; }
        .ticket-note { font-size: 12.5px; color: #93c5fd; background: rgba(56,189,248,0.1); padding: 6px 10px; border-radius: 8px; }
        .ticket-actions { display: flex; gap: 8px; }
        .ticket-actions .btn { flex: 1; justify-content: center; padding: 10px; font-size: 13.5px; }

        /* Queue TV Mode */
        #queueTvView {
            display: none; flex: 1; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px;
        }
        @media (max-width: 800px) { #queueTvView { grid-template-columns: 1fr; } }
        .tv-col {
            background: #111827; border-radius: 24px; padding: 24px; border: 2px solid #1f2937;
            display: flex; flex-direction: column; gap: 18px;
        }
        .tv-col h2 { font-size: 30px; font-weight: 900; text-align: center; padding-bottom: 14px; border-bottom: 2px solid #1f2937; }
        .tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .tv-card {
            background: #1e293b; border-radius: 18px; padding: 22px 14px; text-align: center;
            font-size: 28px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }
        .tv-ready .tv-card { background: linear-gradient(135deg, #059669, #10b981); color: #fff; animation: pulseReady 1.8s infinite; }
        @keyframes pulseReady { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    </style>
</head>
<body>
    <div id="lockedScreen">
        <div style="font-size:64px; margin-bottom:14px;">🔒</div>
        <h1 style="font-size:26px; color:#f87171; margin-bottom:10px;">មុខងារអេក្រង់ផ្ទះបាយ (KDS) ត្រូវបានបិទ</h1>
        <p style="color:#94a3b8; max-width:460px; line-height:1.6;">សូមចូលទៅកាន់ <b>Admin Settings ➔ Tab 9 (មុខងារ Pro)</b> ដើម្បីបើកដំណើរការ <b>អេក្រង់ផ្ទះបាយ & ហៅលេខ (KDS)</b>។</p>
    </div>

    <div class="topbar">
        <div class="brand">
            <i class="fa-solid fa-fire-burner"></i>
            <span id="kdsTitle">Kitchen Display (KDS)</span>
        </div>
        <div class="controls">
            <button id="btnModeBoard" class="btn active" onclick="setKdsMode('board')"><i class="fa-solid fa-kitchen-set"></i> ផ្ទាំងផ្ទះបាយ (KDS)</button>
            <button id="btnModeTv" class="btn" onclick="setKdsMode('tv')"><i class="fa-solid fa-tv"></i> អេក្រង់ហៅលេខ (Queue TV)</button>
            <button class="btn" onclick="refreshOrders(true)"><i class="fa-solid fa-rotate"></i> អាប់ដេត</button>
            <button class="btn" id="btnSound" onclick="toggleSound()">🔊 សំឡេង: On</button>
            <button class="btn" onclick="if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <!-- Mode 1: Kitchen Board -->
    <div id="boardView" class="board">
        <div class="col col-new">
            <div class="col-head"><span>🆕 កុម្ម៉ង់ថ្មី (New Orders)</span><span id="cntNew">0</span></div>
            <div class="col-body" id="listNew"></div>
        </div>
        <div class="col col-prep">
            <div class="col-head"><span>🔥 កំពុងធ្វើ (Preparing)</span><span id="cntPrep">0</span></div>
            <div class="col-body" id="listPrep"></div>
        </div>
        <div class="col col-ready">
            <div class="col-head"><span>✅ រួចរាល់ (Ready)</span><span id="cntReady">0</span></div>
            <div class="col-body" id="listReady"></div>
        </div>
    </div>

    <!-- Mode 2: Customer Queue TV -->
    <div id="queueTvView">
        <div class="tv-col">
            <h2 style="color:#fbbf24;">🔥 កំពុងរៀបចំ (PREPARING)</h2>
            <div class="tv-grid" id="tvPrepGrid"></div>
        </div>
        <div class="tv-col tv-ready" style="border-color:#10b981;">
            <h2 style="color:#34d399;">✅ សូមអញ្ជើញទទួល (READY)</h2>
            <div class="tv-grid" id="tvReadyGrid"></div>
        </div>
    </div>

    <script>
        const BRANCH = new URLSearchParams(window.location.search).get('branch') || 'branch_1';
        const SUPABASE_URL = 'https://qlzyyfqjwudbapgwsugu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsenl5ZnFqd3VkYmFwZ3dzdWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODk2MzUsImV4cCI6MjEwODY2NTYzNX0.XQxNiUn2ZhivOjbqcWj0T6W1Abtx1H3kWrzIwqJPVtQ';
        const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        let sysSettings = {};
        let orders = [];
        let knownIds = new Set();
        let soundEnabled = true;
        let currentMode = 'board';

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('btnSound').innerText = soundEnabled ? '🔊 សំឡេង: On' : '🔇 សំឡេង: Off';
        }

        function playAlertBeep(freq = 880) {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.22);
            } catch(e) {}
        }

        function setKdsMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeBoard').classList.toggle('active', mode === 'board');
            document.getElementById('btnModeTv').classList.toggle('active', mode === 'tv');
            document.getElementById('boardView').style.display = mode === 'board' ? 'grid' : 'none';
            document.getElementById('queueTvView').style.display = mode === 'tv' ? 'grid' : 'none';
            renderKDS();
        }

        function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        async function loadConfig() {
            try {
                const raw = localStorage.getItem(`ks2_${BRANCH}_sys_settings`);
                if (raw) sysSettings = JSON.parse(raw) || {};
            } catch(e) {}
            if (sb && navigator.onLine) {
                try {
                    const { data } = await sb.from('branch_store').select('shop_info, sys_settings').eq('branch_id', BRANCH).maybeSingle();
                    if (data) {
                        if (data.sys_settings) sysSettings = Object.assign({}, sysSettings, data.sys_settings);
                        if (data.shop_info && data.shop_info.shopName) {
                            document.getElementById('kdsTitle').innerText = `${data.shop_info.shopName} — Kitchen Display (KDS)`;
                        }
                    }
                } catch(e) {}
            }
            if (!sysSettings.proFeatures || !sysSettings.proFeatures.kds) {
                document.getElementById('lockedScreen').style.display = 'flex';
                return false;
            }
            document.getElementById('lockedScreen').style.display = 'none';
            return true;
        }

        async function refreshOrders(isManual = false) {
            if (document.hidden && !isManual) return;
            let fetched = [];
            if (sb && navigator.onLine) {
                try {
                    const { data } = await sb.from('pos_orders')
                        .select('id, customer_name, customer_phone, status, order_data, note, timestamp, total_amount')
                        .eq('branch_id', BRANCH)
                        .order('timestamp', { ascending: false })
                        .limit(45);
                    if (Array.isArray(data)) {
                        fetched = data.map(o => ({
                            id: o.id,
                            customer: o.customer_name || 'ទូទៅ',
                            phone: o.customer_phone || '',
                            status: String(o.status || 'unpaid').toLowerCase(),
                            items: Array.isArray(o.order_data) ? o.order_data : [],
                            note: o.note || '',
                            timestamp: o.timestamp || Date.now(),
                            total: parseFloat(o.total_amount || 0)
                        }));
                    }
                } catch(e) {}
            }
            if (fetched.length === 0) {
                try {
                    const loc = JSON.parse(localStorage.getItem(`ks2_${BRANCH}_invoices_pro`) || '[]');
                    fetched = loc.slice(0, 45).map(o => ({
                        id: o.id || o.invoiceNo,
                        customer: o.customerName || o.customer || 'ទូទៅ',
                        phone: o.customerPhone || o.phone || '',
                        status: String(o.status || 'unpaid').toLowerCase(),
                        items: Array.isArray(o.items) ? o.items : [],
                        note: o.note || '',
                        timestamp: o.timestamp || Date.now(),
                        total: parseFloat(o.totalAmount || o.total || 0)
                    }));
                } catch(e) {}
            }

            // Filter out completed/archived kitchen tickets (marked with [✅ រួចរាល់] or older than 24h & paid)
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const active = fetched.filter(o => {
                if (!o || !o.id) return false;
                if (String(o.note).includes('[✅ រួចរាល់]')) return false;
                if (o.status === 'paid' && o.timestamp < cutoff) return false;
                return ['unpaid', 'preorder', 'preparing', 'ready'].includes(o.status);
            });

            if (knownIds.size > 0) {
                const hasNew = active.some(o => !knownIds.has(o.id) && (o.status === 'unpaid' || o.status === 'preorder'));
                if (hasNew) playAlertBeep(980);
            }
            knownIds = new Set(active.map(o => o.id));
            orders = active;
            renderKDS();
        }

        function formatElapsed(ts) {
            const mins = Math.max(0, Math.floor((Date.now() - ts) / 60000));
            const cls = mins >= 20 ? 't-late' : (mins >= 10 ? 't-warn' : 't-ok');
            return { text: mins === 0 ? 'ថ្មីៗនេះ' : `${mins} នាទីមុន`, cls };
        }

        function renderTicketHtml(o, nextBtnHtml) {
            const el = formatElapsed(o.timestamp);
            const cleanNote = String(o.note || '').replace(/\[SLIP_URL:[^\]]+\]/g, '📸 [មាន Slip បង់ប្រាក់]').trim();
            const itemsLi = (o.items || []).map(it => {
                const q = it.cartQty || it.qty || 1;
                const v = it.cartVar && it.cartVar !== 'Base' ? ` <small style="color:#fbbf24;">(${esc(it.cartVar)})</small>` : '';
                return `<li><span class="qty-box">${q}×</span><span>${esc(it.name || it.title)}${v}</span></li>`;
            }).join('');
            return `
                <div class="ticket">
                    <div class="ticket-top">
                        <div>
                            <div class="ticket-id">#${esc(o.id)}</div>
                            <div class="ticket-cust">👤 ${esc(o.customer)}</div>
                        </div>
                        <span class="timer-pill ${el.cls}">⏱ ${el.text}</span>
                    </div>
                    <ul class="ticket-items">${itemsLi || '<li>មិនមានមុខទំនិញ</li>'}</ul>
                    ${cleanNote ? `<div class="ticket-note">📝 ${esc(cleanNote)}</div>` : ''}
                    <div class="ticket-actions">${nextBtnHtml}</div>
                </div>`;
        }

        function renderKDS() {
            const newArr = orders.filter(o => o.status === 'unpaid' || o.status === 'preorder');
            const prepArr = orders.filter(o => o.status === 'preparing');
            const readyArr = orders.filter(o => o.status === 'ready');

            document.getElementById('cntNew').innerText = newArr.length;
            document.getElementById('cntPrep').innerText = prepArr.length;
            document.getElementById('cntReady').innerText = readyArr.length;

            document.getElementById('listNew').innerHTML = newArr.length
                ? newArr.map(o => renderTicketHtml(o, `<button class="btn btn-amber" onclick="updateOrderStatus('${o.id}', 'preparing')">🔥 ចាប់ផ្តើមធ្វើ</button>`)).join('')
                : '<div style="text-align:center; color:#64748b; padding:30px;">មិនមានកុម្ម៉ង់ថ្មីទេ</div>';

            document.getElementById('listPrep').innerHTML = prepArr.length
                ? prepArr.map(o => renderTicketHtml(o, `<button class="btn btn-green" onclick="updateOrderStatus('${o.id}', 'ready')">✅ រួចរាល់ (Ready)</button>`)).join('')
                : '<div style="text-align:center; color:#64748b; padding:30px;">មិនមានមុខម្ហូបកំពុងធ្វើទេ</div>';

            document.getElementById('listReady').innerHTML = readyArr.length
                ? readyArr.map(o => renderTicketHtml(o, `<button class="btn btn-slate" onclick="dismissReadyOrder('${o.id}')">✔ ប្រគល់រួច / លាក់</button>`)).join('')
                : '<div style="text-align:center; color:#64748b; padding:30px;">មិនទាន់មានកុម្ម៉ង់រួចរាល់ទេ</div>';

            // Queue TV Mode
            const shortCode = (o) => {
                const raw = String(o.id || '');
                const tail = raw.split('-').pop() || raw.slice(-4);
                return `${esc(o.customer)}<div style="font-size:15px; opacity:0.85; margin-top:4px;">#${esc(tail)}</div>`;
            };
            document.getElementById('tvPrepGrid').innerHTML = [...newArr, ...prepArr].map(o => `<div class="tv-card">${shortCode(o)}</div>`).join('')
                || '<div style="color:#64748b; font-size:18px; grid-column:1/-1; text-align:center;">---</div>';
            document.getElementById('tvReadyGrid').innerHTML = readyArr.map(o => `<div class="tv-card">${shortCode(o)}</div>`).join('')
                || '<div style="color:#64748b; font-size:18px; grid-column:1/-1; text-align:center;">---</div>';
        }

        async function updateOrderStatus(orderId, newStatus) {
            playAlertBeep(newStatus === 'ready' ? 1100 : 680);
            const target = orders.find(o => o.id === orderId);
            if (target) target.status = newStatus;
            renderKDS();

            try {
                const key = `ks2_${BRANCH}_invoices_pro`;
                const loc = JSON.parse(localStorage.getItem(key) || '[]');
                const idx = loc.findIndex(x => String(x.id || x.invoiceNo) === String(orderId));
                if (idx !== -1) { loc[idx].status = newStatus; localStorage.setItem(key, JSON.stringify(loc)); }
            } catch(e) {}

            if (sb && navigator.onLine) {
                try {
                    await sb.from('pos_orders').update({ status: newStatus }).eq('id', orderId).eq('branch_id', BRANCH);
                    await sb.from('branch_store').update({ updated_at: new Date().toISOString() }).eq('branch_id', BRANCH);
                } catch(e) {}
            }
        }

        async function dismissReadyOrder(orderId) {
            const target = orders.find(o => o.id === orderId);
            const nextNote = target ? (target.note ? `${target.note} [✅ រួចរាល់]` : '[✅ រួចរាល់]') : '[✅ រួចរាល់]';
            orders = orders.filter(o => o.id !== orderId);
            renderKDS();

            try {
                const key = `ks2_${BRANCH}_invoices_pro`;
                const loc = JSON.parse(localStorage.getItem(key) || '[]');
                const idx = loc.findIndex(x => String(x.id || x.invoiceNo) === String(orderId));
                if (idx !== -1) { loc[idx].note = nextNote; localStorage.setItem(key, JSON.stringify(loc)); }
            } catch(e) {}

            if (sb && navigator.onLine) {
                try {
                    await sb.from('pos_orders').update({ note: nextNote }).eq('id', orderId).eq('branch_id', BRANCH);
                } catch(e) {}
            }
        }

        async function boot() {
            const ok = await loadConfig();
            if (!ok) return;
            await refreshOrders(true);
            setInterval(() => refreshOrders(false), 8000);
            setInterval(renderKDS, 30000);
        }
        window.onload = boot;
    </script>
</body>
</html>
