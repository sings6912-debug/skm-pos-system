<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - KouSuKe MiSaKi AniMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ពណ៌ដើម (Default Theme - Sakura Pink ឱ្យស៊ីនឹងឡូហ្គោ) */
            --primary-color: #f472b6;
            --glow-color: rgba(244, 114, 182, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Battambang', 'Nunito', sans-serif;
            color: #f8fafc;
            overflow: hidden;
            
            /* រូបភាពទេសភាពពេញអេក្រង់ដ៏ស្រស់ស្អាតបែប Anime */
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background 1s ease;
        }

        /* ស្រទាប់ពណ៌ស្រមោលគ្របពីលើរូបទេសភាព */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            transition: background 1.5s ease;
        }

        /* ការប្តូរពណ៌ស្រមោល Background ទៅតាម Theme ដែលបានរើស */
        body.theme-sakura::before { background: linear-gradient(135deg, rgba(46, 16, 101, 0.4), rgba(131, 24, 67, 0.6)); }
        body.theme-cyber::before { background: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(74, 4, 78, 0.7)); }
        body.theme-emerald::before { background: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(6, 78, 59, 0.7)); }

        /* Effect កាតអណ្តែតតិចៗយ៉ាងរលូន */
        .welcome-card-wrapper {
            animation: floatCard 6s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* ទម្រង់កញ្ចក់ថ្លា (Glassmorphism) */
        .welcome-card {
            text-align: center;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 40px 45px 40px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.2);
            max-width: 420px;
            width: 90%;
            position: relative;
        }

        /* កន្លែងប្តូរពណ៌ Theme */
        .theme-picker {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .theme-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .theme-dot:hover { transform: scale(1.3); }
        .theme-dot.active { border-color: #fff; transform: scale(1.3); }

        .dot-sakura { background-color: #f472b6; box-shadow: 0 0 12px rgba(244, 114, 182, 0.6); }
        .dot-cyber { background-color: #a855f7; box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
        .dot-emerald { background-color: #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }

        /* រចនាឡូហ្គោអោយកាត់ជារង្វង់មូល ដើម្បីលាក់ផ្ទៃសៗក្រឡាអុក */
        .anime-logo {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%; /* បង្ខំឱ្យកាត់ជារង្វង់មូល */
            border: 3px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            box-shadow: 0 0 20px var(--glow-color); /* ពន្លឺព័ទ្ធជុំវិញរង្វង់ */
            animation: pulseGlow 3s ease-in-out infinite alternate;
            transition: box-shadow 0.5s ease;
            background-color: #fff; /* ចាក់ផ្ទៃសក្នុងរង្វង់ក្រែងឡូហ្គោថ្លា */
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 15px var(--glow-color); transform: scale(1); }
            to { box-shadow: 0 0 35px var(--glow-color); transform: scale(1.05); }
        }

        h1 {
            color: #ffffff;
            margin: 5px 0 5px 0;
            font-size: 26px;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 15px var(--glow-color), 0 0 30px var(--glow-color);
            transition: text-shadow 0.5s ease;
        }
        
        .subtitle {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: color 0.5s ease;
        }

        p {
            color: #e2e8f0;
            margin-bottom: 35px;
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .btn-enter {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 25px var(--glow-color);
            border: 1px solid rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-enter:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px var(--glow-color);
            filter: brightness(1.15);
        }

        .btn-enter:active {
            transform: translateY(1px);
        }

        /* ភាគល្អិតតូចៗ (Magical Particles Effect) */
        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.5;
            animation: rise 10s infinite linear;
            pointer-events: none;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--primary-color);
            transition: box-shadow 0.5s ease;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<!-- លំនាំដើមខ្ញុំដាក់ពណ៌ Theme Sakura (ផ្កាឈូក) ព្រោះវាស៊ីនឹងឡូហ្គោជាងគេ -->
<body class="theme-sakura" id="appBody">

    <!-- សម្រាប់ភាគល្អិត (Magical Particles) -->
    <div class="particle" style="width: 5px; height: 5px; left: 15%; animation-duration: 8s;"></div>
    <div class="particle" style="width: 8px; height: 8px; left: 35%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="particle" style="width: 4px; height: 4px; left: 65%; animation-duration: 9s; animation-delay: 4s;"></div>
    <div class="particle" style="width: 9px; height: 9px; left: 85%; animation-duration: 15s; animation-delay: 1s;"></div>
    <div class="particle" style="width: 6px; height: 6px; left: 50%; animation-duration: 10s; animation-delay: 5s;"></div>

    <div class="welcome-card-wrapper">
        <div class="welcome-card">
            
            <!-- កន្លែងជ្រើសរើសពណ៌ Theme (Color Switcher) -->
            <div class="theme-picker">
                <!-- ដូរ Sakura មកនៅខាងមុខគេព្រោះជាពណ៌លំនាំដើម -->
                <div class="theme-dot dot-sakura active" onclick="changeTheme('sakura', '#f472b6', 'rgba(244, 114, 182, 0.6)')" title="Sakura Pink"></div>
                <div class="theme-dot dot-cyber" onclick="changeTheme('cyber', '#a855f7', 'rgba(168, 85, 247, 0.6)')" title="Cyberpunk Purple"></div>
                <div class="theme-dot dot-emerald" onclick="changeTheme('emerald', '#10b981', 'rgba(16, 185, 129, 0.6)')" title="Emerald Green"></div>
            </div>

            <!-- រូបភាពឡូហ្គោហាងរបស់បង (logo1.png) -->
            <img src="logo1.png" alt="KouSuKe MiSaKi AniMe" class="anime-logo">
            
            <h1>KouSuKe MiSaKi AniMe</h1>
            <div class="subtitle">Your Doll Haven</div>
            <p>ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុកទំនិញឆ្លាតវៃ</p>
            
            <!-- កន្លែងនេះ Link ទៅកាន់ File ចាស់របស់បង -->
            <a href="index.html" class="btn-enter">ចូលប្រើប្រាស់ ➔</a>
        </div>
    </div>

    <!-- Script សម្រាប់បញ្ជាការប្តូរពណ៌ Theme ភ្លាមៗ -->
    <script>
        function changeTheme(themeName, primaryColor, glowColor) {
            const body = document.getElementById('appBody');
            body.className = '';
            body.classList.add('theme-' + themeName);

            document.documentElement.style.setProperty('--primary-color', primaryColor);
            document.documentElement.style.setProperty('--glow-color', glowColor);

            document.querySelectorAll('.theme-dot').forEach(dot => {
                dot.classList.remove('active');
            });
            document.querySelector('.dot-' + themeName).classList.add('active');
        }
    </script>
</body>
</html>
