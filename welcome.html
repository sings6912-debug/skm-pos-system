<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - POS & ERP System</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- បណ្ណាល័យ Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary-color: #10b981;
            --glow-color: rgba(16, 185, 129, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Battambang', 'Nunito', sans-serif;
            color: #f8fafc;
            overflow: hidden;
            background-color: #0f172a;
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85));
            transition: background 1s ease;
        }

        .welcome-card-wrapper {
            animation: floatCard 6s ease-in-out infinite;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .welcome-card {
            text-align: center;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.15);
            max-width: 420px;
            width: 90%;
        }

        .logo-box {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 3px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--glow-color);
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-box .default-icon {
            font-size: 60px;
        }

        h1 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-size: 26px;
            font-family: 'Nunito', 'Battambang', sans-serif;
            font-weight: 900;
            text-shadow: 0 0 15px var(--glow-color);
        }

        .branch-tag {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: bold;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        .btn-enter {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 14px;
            display: inline-block;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 25px var(--glow-color);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="welcome-card-wrapper">
        <div class="welcome-card">
            
            <div class="logo-box" id="logoContainer">
                <span class="default-icon" id="defaultIcon">🏪</span>
                <img id="dynamicLogo" src="" alt="Shop Logo" style="display: none;">
            </div>

            <h1 id="displayShopName">កំពុងទាញយកទិន្នន័យ...</h1>
            <div class="branch-tag" id="displayBranchTag">សាខា៖ ទូទៅ</div>
            <p>ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុកទំនិញឆ្លាតវៃ (ERP & POS)</p>
            
            <a href="#" id="enterAppBtn" class="btn-enter">ចូលប្រើប្រាស់ប្រព័ន្ធ ➔</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uynmpjykedjjjyxczsja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5bm1wanlrZWRqamp5eGN6c2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDc1NjIsImV4cCI6MjEwMjE4MzU2Mn0.vw8UpBoEWvbQwl2J5alfTB0nvv7EizB8EpwEsp4ugCg';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const SHOP_BRANCH_ID = urlParams.get('branch') || 'branch_1';
        const getBranchKey = (key) => `ks2_${SHOP_BRANCH_ID}_${key}`;

        // កំណត់ Link ប៊ូតុងចូលប្រើប្រាស់ទៅកាន់ index.html តាមសាខាជាក់ស្តែង
        document.getElementById('enterAppBtn').href = `index.html?branch=${encodeURIComponent(SHOP_BRANCH_ID)}`;
        document.getElementById('displayBranchTag').innerText = `សាខា៖ ${SHOP_BRANCH_ID}`;

        async function loadShopProfile() {
            let shopName = 'SKM INTEGRATE';
            let shopLogo = '';

            try {
                // ១. ទាញយកទិន្នន័យពី Supabase តាម Branch ID
                let { data, error } = await supabaseClient
                    .from('branch_store')
                    .select('data_json')
                    .eq('branch_id', SHOP_BRANCH_ID)
                    .single();

                if (data && data.data_json) {
                    shopName = data.data_json.shopName || shopName;
                    shopLogo = data.data_json.shopLogo || '';
                } else {
                    // ២. បើគ្មានលើ Supabase ទាញពី LocalStorage
                    shopName = localStorage.getItem(getBranchKey('shop_name')) || shopName;
                    shopLogo = localStorage.getItem(getBranchKey('shop_logo')) || '';
                }
            } catch (e) {
                shopName = localStorage.getItem(getBranchKey('shop_name')) || shopName;
                shopLogo = localStorage.getItem(getBranchKey('shop_logo')) || '';
            }

            // បង្ហាញឈ្មោះហាង
            document.getElementById('displayShopName').innerText = shopName;

            // បង្ហាញ Logo របស់ហាងនោះ (បើគ្មានទេ បង្ហាញ Icon ធម្មតា)
            const logoImg = document.getElementById('dynamicLogo');
            const defaultIcon = document.getElementById('defaultIcon');

            if (shopLogo && shopLogo.trim() !== '') {
                logoImg.src = shopLogo;
                logoImg.style.display = 'block';
                defaultIcon.style.display = 'none';
            } else {
                logoImg.style.display = 'none';
                defaultIcon.style.display = 'block';
            }
        }

        window.onload = loadShopProfile;
    </script>
</body>
</html>
