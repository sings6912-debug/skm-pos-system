<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - POS & ERP System</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">

    <!-- បណ្ណាល័យ Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary-color: #10b981;
            --primary-hover: #059669;
            --glow-color: rgba(16, 185, 129, 0.45);
            --current-bg: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2000&auto=format&fit=crop');
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Battambang', 'Nunito', sans-serif; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
            overflow: hidden;
            background-color: #0f172a;
            background-image: var(--current-bg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.5s ease;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.95) 100%);
            backdrop-filter: blur(5px);
        }

        /* 🌟 Top Control Bar */
        .top-control-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            flex-wrap: wrap;
        }

        .control-btn {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            border-color: var(--primary-color);
            background: rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        select.control-btn {
            appearance: none;
            padding-right: 32px;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23ffffff' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
        }
        select.control-btn option { background: #0f172a; color: #fff; }

        /* 🌟 3D & Float Animation Wrapper */
        .welcome-card-wrapper {
            perspective: 1000px;
            animation: animeFloat 4.5s ease-in-out infinite;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        @keyframes animeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .welcome-card {
            text-align: center;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 440px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        /* 🌟 Animated Glowing Logo Box */
        .logo-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(16, 185, 129, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
            transform: translateZ(30px);
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.7); border-color: rgba(16, 185, 129, 0.9); }
        }

        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .logo-box .default-icon { font-size: 45px; }

        h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 0 0 15px var(--glow-color);
            transform: translateZ(25px);
        }

        .tags-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            transform: translateZ(20px);
        }

        .branch-tag, .status-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .branch-tag { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; }

        p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; transform: translateZ(15px); }

        .buttons-group { display: flex; flex-direction: column; gap: 12px; transform: translateZ(30px); }

        .btn-enter {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-menu { background: linear-gradient(135deg, #0284c7, #0369a1); box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4); }
        .btn-admin { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        
        .btn-enter:hover { transform: translateY(-3px) scale(1.02); filter: brightness(1.1); }
        .btn-enter:active { transform: translateY(0) scale(0.98); }

        /* 🌟 News Ticker (Shift Announcement) */
        .news-ticker {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #fbbf24;
            padding: 8px 0;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            z-index: 1000;
        }
        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: tickerScroll 25s linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* 🌟 PIN Modal */
        .pin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .pin-modal.show { display: flex; opacity: 1; }
        
        .pin-pad {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pin-modal.show .pin-pad { transform: scale(1); }
        
        .pin-display {
            font-size: 24px;
            letter-spacing: 10px;
            margin-bottom: 20px;
            color: #10b981;
            height: 40px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .pin-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 60px; height: 60px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pin-btn:hover { background: rgba(16, 185, 129, 0.3); border-color: #10b981; }
        .pin-btn:active { transform: scale(0.9); }
        .pin-btn.cancel { color: #ef4444; font-size: 16px; }
        .pin-btn.clear { color: #f59e0b; font-size: 16px; }

        /* 🌟 Offline Indicator */
        #networkStatus {
            position: fixed; top: 20px; left: 20px;
            display: none; background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(8px); color: #fff; padding: 10px 16px;
            border-radius: 50px; font-size: 12px; font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="networkStatus">⚠️ គ្មានអ៊ីនធឺណិត (Offline Mode)</div>

    <div class="top-control-bar">
        <select id="langSelect" class="control-btn" onchange="changeLanguage(this.value)">
            <option value="km">🇰🇭 ខ្មែរ</option>
            <option value="en">🇬🇧 English</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
        <button class="control-btn" onclick="changeBackground()">🖼️ ប្តូររូប</button>
    </div>

    <div class="welcome-card-wrapper">
        <div class="welcome-card" id="tiltCard">
            <div class="logo-box">
                <span class="default-icon" id="defaultIcon">🏪</span>
                <img id="dynamicLogo" src="" alt="Shop Logo" style="display: none;">
            </div>

            <h1 id="displayShopName">Loading...</h1>
            
            <div class="tags-container">
                <div class="branch-tag" id="displayBranchTag">សាខា៖ ទូទៅ</div>
                <div class="status-tag" id="displayStoreStatus">🟢 កំពុងបើកលក់</div>
            </div>

            <p id="displaySubtitle">ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុកទំនិញឆ្លាតវៃ (ERP & POS)</p>
            
            <div class="buttons-group">
                <button onclick="goToMenu()" class="btn-enter btn-menu">🛒 ចូលមើលម៉ឺនុយ (Digital Menu)</button>
                <button onclick="openPinModal()" class="btn-enter btn-admin">🔐 ចូលប្រព័ន្ធគ្រប់គ្រង (POS / Admin)</button>
            </div>
        </div>
    </div>

    <!-- 🌟 PIN Modal -->
    <div class="pin-modal" id="pinModal">
        <div class="pin-pad">
            <h3 style="color:#fff; margin-bottom:10px; font-family:'Battambang';">បញ្ចូលលេខសម្ងាត់</h3>
            <div class="pin-display" id="pinDisplay">_ _ _ _</div>
            <div class="pin-grid">
                <button class="pin-btn" onclick="enterPin(1)">1</button>
                <button class="pin-btn" onclick="enterPin(2)">2</button>
                <button class="pin-btn" onclick="enterPin(3)">3</button>
                <button class="pin-btn" onclick="enterPin(4)">4</button>
                <button class="pin-btn" onclick="enterPin(5)">5</button>
                <button class="pin-btn" onclick="enterPin(6)">6</button>
                <button class="pin-btn" onclick="enterPin(7)">7</button>
                <button class="pin-btn" onclick="enterPin(8)">8</button>
                <button class="pin-btn" onclick="enterPin(9)">9</button>
                <button class="pin-btn clear" onclick="clearPin()">⌫</button>
                <button class="pin-btn" onclick="enterPin(0)">0</button>
                <button class="pin-btn cancel" onclick="closePinModal()">X</button>
            </div>
        </div>
    </div>

    <!-- 🌟 News Ticker -->
    <div class="news-ticker">
        <div class="ticker-content" id="tickerText">
            📢 សេចក្តីជូនដំណឹងប្រចាំថ្ងៃ៖ សូមបុគ្គលិកទាំងអស់ពិនិត្យមើលស្តុកទំនិញឱ្យបានត្រឹមត្រូវមុនពេលប្តូរវេន! ជូនពរឱ្យការលក់ដាច់ច្រើនៗ! 🚀
        </div>
    </div>

    <script>
        // Supabase Init
        const SUPABASE_URL = 'https://uynmpjykedjjjyxczsja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5bm1wanlrZWRqamp5eGN6c2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDc1NjIsImV4cCI6MjEwMjE4MzU2Mn0.vw8UpBoEWvbQwl2J5alfTB0nvv7EizB8EpwEsp4ugCg';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const SHOP_BRANCH_ID = urlParams.get('branch') || 'branch_1';
        let currentLang = 'km';
        
        // 🔊 Sci-Fi Sound Effect function
        function playClickSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if(!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1500, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        // 🚀 3D Tilt Effect
        const card = document.getElementById('tiltCard');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.transition = 'transform 0.5s ease';
        });
        card.addEventListener('mouseenter', () => card.style.transition = 'none');

        // 🔐 PIN Logic
        let pinCode = '';
        function openPinModal() {
            playClickSound();
            document.getElementById('pinModal').classList.add('show');
            pinCode = '';
            updatePinDisplay();
        }
        function closePinModal() {
            playClickSound();
            document.getElementById('pinModal').classList.remove('show');
        }
        function enterPin(num) {
            playClickSound();
            if(pinCode.length < 4) {
                pinCode += num;
                updatePinDisplay();
                if(pinCode.length === 4) {
                    setTimeout(() => {
                        // ចូលទៅកាន់ Index ជាមួយ PIN ជាប់ Parameter
                        window.location.href = `index.html?branch=${encodeURIComponent(SHOP_BRANCH_ID)}&pin=${pinCode}`;
                    }, 300);
                }
            }
        }
        function clearPin() {
            playClickSound();
            pinCode = pinCode.slice(0, -1);
            updatePinDisplay();
        }
        function updatePinDisplay() {
            const display = document.getElementById('pinDisplay');
            let text = '';
            for(let i=0; i<4; i++) {
                text += i < pinCode.length ? '● ' : '_ ';
            }
            display.innerText = text.trim();
        }

        function goToMenu() {
            playClickSound();
            window.location.href = `menu.html?branch=${encodeURIComponent(SHOP_BRANCH_ID)}`;
        }

        // 🌐 Network Status
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        function updateNetworkStatus() {
            const netEl = document.getElementById('networkStatus');
            netEl.style.display = navigator.onLine ? 'none' : 'block';
        }

        // 🔄 Fetch Data with Timeout
        async function loadShopProfile() {
            let shopName = localStorage.getItem(`ks2_${SHOP_BRANCH_ID}_shop_name`) || 'SKM INTEGRATE';
            let shopLogo = localStorage.getItem(`ks2_${SHOP_BRANCH_ID}_shop_logo`) || '';
            const savedBg = localStorage.getItem(`ks2_${SHOP_BRANCH_ID}_custom_bg`);
            if (savedBg) document.documentElement.style.setProperty('--current-bg', savedBg);

            applyShopUI(shopName, shopLogo);

            if(navigator.onLine) {
                try {
                    const fetchPromise = supabaseClient.from('branch_store').select('data_json').eq('branch_id', SHOP_BRANCH_ID).single();
                    const timeoutPromise = new Promise((_, r) => setTimeout(() => r(new Error('Timeout')), 5000));
                    let { data } = await Promise.race([fetchPromise, timeoutPromise]);
                    
                    if (data && data.data_json) {
                        shopName = data.data_json.shopName || shopName;
                        shopLogo = data.data_json.shopLogo || '';
                        localStorage.setItem(`ks2_${SHOP_BRANCH_ID}_shop_name`, shopName);
                        localStorage.setItem(`ks2_${SHOP_BRANCH_ID}_shop_logo`, shopLogo);
                        applyShopUI(shopName, shopLogo);
                    }
                } catch(e) { console.warn('Offline or Timeout', e); }
            }
            updateStoreStatus();
        }

        function applyShopUI(name, logo) {
            document.getElementById('displayShopName').innerText = name;
            const logoImg = document.getElementById('dynamicLogo');
            const defaultIcon = document.getElementById('defaultIcon');
            if (logo) {
                logoImg.src = logo;
                logoImg.style.display = 'block';
                defaultIcon.style.display = 'none';
            }
        }

        // 🕒 Status Check
        function updateStoreStatus() {
            const hour = new Date().getHours();
            const statusEl = document.getElementById('displayStoreStatus');
            if (hour >= 8 && hour < 21) {
                statusEl.innerText = '🟢 កំពុងបើកលក់';
                statusEl.style.background = 'rgba(52, 211, 153, 0.15)';
                statusEl.style.color = '#34d399';
                statusEl.style.borderColor = 'rgba(52, 211, 153, 0.4)';
            } else {
                statusEl.innerText = '🔴 បិទសម្រាក';
                statusEl.style.background = 'rgba(239, 68, 68, 0.15)';
                statusEl.style.color = '#f87171';
                statusEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            }
        }

        // 🖼️ Wallpaper Presets
        const backgrounds = [
            'url("https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2000&auto=format&fit=crop")',
            'url("https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop")',
            'url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop")'
        ];
        let bgIndex = 0;
        function changeBackground() {
            playClickSound();
            bgIndex = (bgIndex + 1) % backgrounds.length;
            document.documentElement.style.setProperty('--current-bg', backgrounds[bgIndex]);
            localStorage.setItem(`ks2_${SHOP_BRANCH_ID}_custom_bg`, backgrounds[bgIndex]);
        }

        // Language Switch (Basic setup for UI)
        function changeLanguage(lang) {
            playClickSound();
            currentLang = lang;
            document.getElementById('displayBranchTag').innerText = (lang==='en'?'Branch: ':'សាខា៖ ') + SHOP_BRANCH_ID;
            document.getElementById('displaySubtitle').innerText = lang==='en'?'Smart POS & ERP System':'ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុកទំនិញឆ្លាតវៃ (ERP & POS)';
        }

        window.onload = loadShopProfile;
    </script>
</body>
</html>
